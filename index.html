<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arkaya — We Build Things People Remember</title>
    <meta name="description" content="Arkaya is a creative digital agency crafting AI agents, custom websites, mobile APKs, and automation tools." />
    <script>
      // Handle SPA redirect from 404.html on GitHub Pages
      (function() {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          window.history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
