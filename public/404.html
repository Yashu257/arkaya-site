<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Arkaya</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // Stores the path in sessionStorage and redirects to index.html
      // which then reads it and navigates to the correct route.
      var path = window.location.pathname;
      var base = '/arkaya-site';
      var route = path.replace(base, '') || '/';
      sessionStorage.setItem('spa-redirect', route + window.location.search);
      window.location.replace(base + '/');
    </script>
  </head>
  <body></body>
</html>
